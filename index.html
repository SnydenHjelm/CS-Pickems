<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Pickems</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/old.css">
    <link rel="stylesheet" href="styles/playoffs.css">
</head>
<body>
    <h1>SnydenHjelm's CS Pick'Ems</h1>
    <p>Browse my picks from Antwerp 2022 and forward</p>
    <div id="loading">
        <img src="images/loading.gif">
        <p>Please wait...</p>
    </div>
    <select id="major"></select>
    <h2 id="major-name"></h2>
    <main>
        <div id="coin-result">
            <h2></h2>
            <img>
        </div>
        <div id="old">
            <div stage="challengers" class="old-group">
                <h2>Challengers Stage</h2>
                <div stage="challengers" class="old-30-03">
                    <div pick="3-0" class="pick"><img><p></p></div>
                    <div pick="0-3" class="pick"><img><p></p></div>
                </div>
                <div stage="challengers" class="old-advanced">
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                </div>
            </div>

            <div stage="legends" class="old-group">
                <h2>Legends Stage</h2>
                <div stage="legends" class="old-30-03">
                    <div pick="3-0" class="pick"><img><p></p></div>
                    <div pick="0-3" class="pick"><img><p></p></div>
                </div>
                <div stage="legends" class="old-advanced">
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                    <div pick="advance" class="pick"><img><p></p></div>
                </div>
            </div>

            <div stage="playoffs" class="playoffs">
                <h2>Champions Stage</h2>
                <h3>Bold = Team I picked to win</h3>
                <div class="playoff-wrapper">
                    <div game="qf" class="qf">
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                    </div>
                    <div game="sf" class="sf">
                        <div></div>
                        <div></div>
                    </div>
                    <div game="gf" class="gf">
                        <div></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="scripts/req.js"></script>
    <script src="scripts/playoffs.js"></script>
    <script src="scripts/old.js"></script>
    <script src="scripts/methods.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
